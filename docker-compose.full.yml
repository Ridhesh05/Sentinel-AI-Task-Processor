version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: sentinel_postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/init.sql


  redis:
    image: redis:7
    container_name: sentinel_redis
    ports:
      - "6379:6379"

  api:
    build: ./api
    container_name: sentinel_api
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sentinel_db
      - DB_USER=sentinel
      - DB_PASSWORD=sentinel
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT=10
      - RATE_WINDOW=60


  worker:
    build: ./worker
    container_name: sentinel_worker
    depends_on:
      - postgres
      - redis
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sentinel_db
      - DB_USER=sentinel
      - DB_PASSWORD=sentinel
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_TRIM_MAXAGE_MINUTES=15
      - PROCESSING_DELAY_SEC=120


  monitor:
    build: ./monitor
    container_name: sentinel_monitor
    depends_on:
      - redis
    ports:
      - "9000:9000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  frontend:
    build: ./frontend
    container_name: sentinel_frontend
    depends_on:
      - api
      - monitor
    ports:
      - "3000:80"

  adminer:
    image: adminer:latest
    container_name: sentinel_adminer
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USERNAME: sentinel
      ADMINER_DEFAULT_PASSWORD: sentinel
